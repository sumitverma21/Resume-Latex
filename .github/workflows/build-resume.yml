name: Build and Release Resume PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.tex'
      - '**.cls'
      - 'links/**'
      - 'sections/**'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Default Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Compile AI/ML Engineer Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-aiml.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Compile Software Engineer Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-swe.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Prepare Named Resume PDFs
        run: |
          cp resume.pdf sumit-verma.pdf
          cp resume-aiml.pdf sumit-verma-aiml.pdf
          cp resume-swe.pdf sumit-verma-swe.pdf

      - name: Generate High-Resolution Resume Preview Images
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pdftoppm -png -r 300 -singlefile resume.pdf resume-preview
          pdftoppm -png -r 300 -singlefile resume-aiml.pdf resume-aiml-preview
          pdftoppm -png -r 300 -singlefile resume-swe.pdf resume-swe-preview

      - name: Commit and Push Resume Preview Images
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add resume-preview.png resume-aiml-preview.png resume-swe-preview.png
          if git diff --staged --quiet; then
            echo "No changes to resume preview images."
          else
            git commit -m "chore: update resume preview images [skip ci]"
            git push
          fi

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sumit-verma-resumes
          path: |
            sumit-verma.pdf
            sumit-verma-aiml.pdf
            sumit-verma-swe.pdf
          overwrite: true

      - name: Generate Release Tag and Metadata
        id: release_meta
        run: |
          git fetch --tags --force 2>/dev/null || true
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="Resume Release ${TAG_NAME}"
          else
            LAST_TAG=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)
            if [ -z "$LAST_TAG" ]; then
              NEXT_NUM=1
            else
              NEXT_NUM=$((LAST_TAG + 1))
            fi
            TAG_NAME="v${NEXT_NUM}"
            RELEASE_TITLE="Resume Build #${NEXT_NUM}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body: |
            Automatically compiled resumes generated by GitHub Actions.

            - **AI/ML Engineer Resume:** `sumit-verma-aiml.pdf`
            - **Software Engineer Resume:** `sumit-verma-swe.pdf`
            - **Default / Combined:** `sumit-verma.pdf`
            - **Release:** `${{ steps.release_meta.outputs.tag_name }}`
            - **Commit:** ${{ github.sha }}
            - **Trigger:** `${{ github.event_name }}` on `${{ github.ref_name }}`
          draft: false
          prerelease: false
          files: |
            sumit-verma.pdf
            sumit-verma-aiml.pdf
            sumit-verma-swe.pdf
            resume-preview.png
            resume-aiml-preview.png
            resume-swe-preview.png
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
